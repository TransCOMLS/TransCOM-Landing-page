      <button type="button" class="btn btn-primary btn-block" data-close-modal data-i18n="privacy.dialogDone"></button>

    <div class="modal-body post-dialog-body">

      </div>
    </div>
    <div class="modal-foot" id="post-dialog-foot"></div>
  </dialog>
